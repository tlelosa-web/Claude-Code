<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>✈️ AviatorQuest - Pilot v1.4.1</title>
    <style>
        :root {
            --primary: #ef4444; --secondary: #10b981; --accent: #fbbf24;
            --bg: #0f172a; --panel: #1e293b; --text: #f8fafc; --glass: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 15px; overflow-x: hidden; }
        .container { width: 100%; max-width: 450px; margin: 0 auto; }

        /* Animations */
        @keyframes shake { 0% { transform: translate(1px, 1px); } 20% { transform: translate(-3px, 0px); } 40% { transform: translate(3px, 2px); } 60% { transform: translate(-1px, -1px); } 100% { transform: translate(0px, 0px); } }
        .crash-shake { animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both; background: rgba(239, 68, 68, 0.2) !important; }
        @keyframes pulse-green { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
        .win-pulse { animation: pulse-green 0.6s ease-out; }

        header { text-align: center; margin-bottom: 10px; }
        .nav-bar { display: flex; gap: 5px; margin-bottom: 15px; background: rgba(0,0,0,0.3); padding: 5px; border-radius: 12px; }
        .nav-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; background: transparent; color: #64748b; font-weight: 800; cursor: pointer; font-size: 11px; }
        .nav-btn.active { background: var(--panel); color: white; }

        .cockpit-panel { background: var(--panel); border-radius: 20px; padding: 18px; border: 1px solid var(--glass); position: relative; margin-bottom: 15px; transition: 0.3s; }

        .safety-bracket { position: absolute; top: 110px; left: 50%; transform: translateX(-50%); width: 40px; height: 20px; border: 2px solid var(--glass); border-top: none; display: none; border-radius: 0 0 10px 10px; }
        .safety-secured { border-color: var(--secondary) !important; display: block; }
        .safety-text { position: absolute; bottom: -18px; left: -15px; font-size: 8px; color: var(--secondary); white-space: nowrap; font-weight: 900; }

        .bar-container { margin-bottom: 10px; }
        .label-row { display: flex; justify-content: space-between; font-size: 9px; font-weight: 800; margin-bottom: 4px; color: #94a3b8; }
        .progress-track { height: 8px; background: #000; border-radius: 10px; overflow: hidden; border: 1px solid var(--glass); }
        .progress-bar { height: 100%; transition: 1s; width: 0%; }
        #main-prog-bar { background: linear-gradient(90deg, var(--primary), var(--accent), var(--secondary)); }
        #fuel-prog-bar { background: var(--secondary); box-shadow: 0 0 10px var(--secondary); }

        .bet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; position: relative; }
        .bet-card { background: rgba(0,0,0,0.2); padding: 12px; border-radius: 15px; border: 1px solid var(--glass); z-index: 2; }
        .unit-input { width: 100%; background: transparent; border: none; color: white; font-size: 22px; font-weight: 900; outline: none; text-align: center; }
        
        .quick-taps { display: flex; gap: 4px; margin-top: 8px; }
        .tap-btn { flex: 1; padding: 4px; font-size: 9px; background: var(--glass); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 4px; cursor: pointer; font-weight: 800; }
        
        .btn-action { width: 100%; padding: 16px; border-radius: 12px; border: none; font-weight: 900; text-transform: uppercase; cursor: pointer; transition: 0.1s; }
        .btn-cashout { background: var(--secondary); color: #064e3b; margin-top: 5px; }
        .btn-crash { background: var(--primary); color: white; font-size: 20px; box-shadow: 0 5px 0 #991b1b; }
        .btn-action:active { transform: translateY(3px); box-shadow: none; }

        .config-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .config-row input { width: 140px; padding: 8px; background: #000; border: 1px solid var(--glass); color: white; border-radius: 8px; text-align: right; font-weight: 700; }

        #milestone-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; text-align: center; padding: 20px; }
        .milestone-icon { font-size: 60px; margin-bottom: 20px; }
        .hidden { display: none; }
    </style>
</head>
<body id="main-body">

    <div class="container" id="cockpit-container">
        <header>
            <div id="pilot-rank" style="font-size: 10px; color: var(--accent); font-weight: 900; letter-spacing: 2px;">ROOKIE PILOT</div>
            <h1 id="title-text">✈️ AVIATOR QUEST</h1>
        </header>

        <nav class="nav-bar">
            <button class="nav-btn active" onclick="showView('execution')">COCKPIT</button>
            <button class="nav-btn" onclick="showView('stats')">FLIGHT LOG</button>
            <button class="nav-btn" onclick="showView('settings')">MISSION CONFIG</button>
        </nav>

        <div class="cockpit-panel">
            <div class="bar-container">
                <div class="label-row"><span>MISSION PROGRESS</span><span id="main-pct">0%</span></div>
                <div class="progress-track"><div class="progress-bar" id="main-prog-bar"></div></div>
            </div>
            <div class="bar-container">
                <div class="label-row"><span>DAILY FUEL (PROFIT)</span><span id="fuel-pct">0%</span></div>
                <div class="progress-track"><div class="progress-bar" id="fuel-prog-bar"></div></div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; text-align: center;">
                <div><div class="label-row" style="justify-content:center;">BANKROLL</div><div id="disp-bank" style="font-weight:900; font-size:18px; color:var(--secondary);">R0</div></div>
                <div><div class="label-row" style="justify-content:center;">TOTAL STAKE</div><div id="disp-stake" style="font-weight:900; font-size:18px; color:var(--accent);">R0</div></div>
            </div>
        </div>

        <div id="view-execution">
            <div class="bet-grid">
                <div class="safety-bracket" id="bracket"><span class="safety-text">MISSION SECURED</span></div>
                
                <div class="bet-card" id="card-a">
                    <label style="font-size:9px; font-weight:800; color:#94a3b8;">BET A (UNITS)</label>
                    <input type="number" id="unit-a" class="unit-input" value="2" oninput="syncBets()">
                    <div class="quick-taps">
                        <button class="tap-btn" onclick="quickCash(1, 2.0)">2.0x</button>
                        <button class="tap-btn" onclick="quickCash(1, 2.5)">2.5x</button>
                        <button class="tap-btn" onclick="quickCash(1, 3.0)">3.0x</button>
                    </div>
                    <button class="btn-action btn-cashout" id="btn-a" onclick="cashout(1)">CASHOUT A</button>
                </div>

                <div class="bet-card" id="card-b">
                    <label style="font-size:9px; font-weight:800; color:#94a3b8;">BET B (UNITS)</label>
                    <input type="number" id="unit-b" class="unit-input" value="1" oninput="updateCalculations()">
                    <div class="quick-taps">
                        <button class="tap-btn" onclick="quickCash(2, 2.0)">2.0x</button>
                        <button class="tap-btn" onclick="quickCash(2, 2.5)">2.5x</button>
                        <button class="tap-btn" onclick="quickCash(2, 3.0)">3.0x</button>
                    </div>
                    <button class="btn-action btn-cashout" id="btn-b" onclick="cashout(2)">CASHOUT B</button>
                </div>
            </div>
            <button class="btn-action btn-crash" onclick="triggerCrash()">CRASH</button>
        </div>

        <div id="view-stats" class="hidden">
            <div class="cockpit-panel" id="log-list"></div>
        </div>

        <div id="view-settings" class="hidden">
            <div class="cockpit-panel">
                <div class="config-row"><label>Opening Bankroll</label><input type="number" id="set-start" value="1000"></div>
                <div class="config-row"><label>Target Goal</label><input type="number" id="set-target" value="10000"></div>
                <div class="config-row"><label>Start Date</label><input type="date" id="set-date"></div>
                <div class="config-row"><label>Auto-B % of A</label><input type="number" id="set-ratio" value="50"></div>
                <button class="btn-action btn-cashout" onclick="saveSettings()">RE-CALIBRATE MISSION</button>
            </div>
        </div>
    </div>

    <div id="milestone-modal">
        <div class="milestone-icon">🏆</div>
        <h2 id="milestone-title">25% REACHED</h2>
        <p id="milestone-msg" style="margin: 15px 0; color: #94a3b8;"></p>
        <button class="btn-action btn-cashout" onclick="closeMilestone()">CONTINUE MISSION</button>
    </div>

    <script>
        let bankroll = 1000, startBank = 1000, target = 10000, ratio = 50;
        let tradeLog = [], milestonesReached = [];
        let aActive = true, bActive = true, roundProfit = 0;

        function haptic(type) { if(navigator.vibrate) navigator.vibrate(type === 'win' ? 50 : 200); }

        function syncBets() {
            let aVal = parseFloat(document.getElementById('unit-a').value) || 0;
            document.getElementById('unit-b').value = (aVal * (ratio/100)).toFixed(2);
            updateCalculations();
        }

        function updateCalculations() {
            let unitVal = bankroll * 0.01;
            let uA = parseFloat(document.getElementById('unit-a').value) || 0;
            let uB = parseFloat(document.getElementById('unit-b').value) || 0;
            let totalStake = (uA + uB) * unitVal;
            
            document.getElementById('disp-bank').textContent = 'R' + bankroll.toFixed(0);
            document.getElementById('disp-stake').textContent = 'R' + totalStake.toFixed(2);

            let potentialReturnA = (uA * unitVal) * 1.5;
            if(potentialReturnA >= totalStake && uA > 0) {
                document.getElementById('bracket').classList.add('safety-secured');
            } else {
                document.getElementById('bracket').classList.remove('safety-secured');
            }
            save();
        }

        function cashout(num, multiplier = null) {
            let mult = multiplier || prompt("Multiplier?", "2.0");
            if(!mult) return;
            
            haptic('win');
            document.getElementById('cockpit-container').classList.add('win-pulse');
            setTimeout(() => document.getElementById('cockpit-container').classList.remove('win-pulse'), 600);

            let unitVal = bankroll * 0.01;
            let stake = parseFloat(document.getElementById(num === 1 ? 'unit-a' : 'unit-b').value) * unitVal;
            roundProfit += (stake * mult) - stake;

            if(num === 1) { aActive = false; document.getElementById('btn-a').classList.add('hidden'); }
            if(num === 2) { 
                if(aActive) cashout(1, 1.5); 
                bActive = false; document.getElementById('btn-b').classList.add('hidden'); 
            }

            if(!aActive && !bActive) finalize();
        }

        function quickCash(n, m) { cashout(n, m); }

        function triggerCrash() {
            haptic('loss');
            document.body.classList.add('crash-shake');
            setTimeout(() => document.body.classList.remove('crash-shake'), 300);

            let unitVal = bankroll * 0.01;
            if(aActive) roundProfit -= parseFloat(document.getElementById('unit-a').value) * unitVal;
            if(bActive) roundProfit -= parseFloat(document.getElementById('unit-b').value) * unitVal;
            finalize();
        }

        function finalize() {
            bankroll += roundProfit;
            tradeLog.push({ p: roundProfit, b: bankroll });
            roundProfit = 0; aActive = true; bActive = true;
            document.getElementById('btn-a').classList.remove('hidden');
            document.getElementById('btn-b').classList.remove('hidden');
            updateUI();
        }

        function updateUI() {
            let progress = ((bankroll - startBank) / (target - startBank)) * 100;
            document.getElementById('main-prog-bar').style.width = Math.min(progress, 100) + '%';
            document.getElementById('main-pct').textContent = progress.toFixed(1) + '%';

            let dailyGoal = startBank * 0.05;
            let dailyProg = (tradeLog.reduce((a,b) => a + b.p, 0) / dailyGoal) * 100;
            document.getElementById('fuel-prog-bar').style.width = Math.min(dailyProg, 100) + '%';
            document.getElementById('fuel-pct').textContent = Math.max(0, dailyProg).toFixed(0) + '%';

            checkMilestones(progress);
            updateCalculations();
        }

        function checkMilestones(p) {
            [25, 50, 75, 100].forEach(m => {
                if(p >= m && !milestonesReached.includes(m)) {
                    milestonesReached.push(m);
                    showMilestone(m);
                }
            });
        }

        function showMilestone(m) {
            document.getElementById('milestone-modal').style.display = 'flex';
            document.getElementById('milestone-title').textContent = m + '% MISSION COMPLETE';
            let msg = "Keep your altitude, Pilot!";
            if(m === 50) msg = "STRATEGY ALERT: You have hit 50%. Consider withdrawing your initial stake to play on 'House Money'.";
            if(m === 100) msg = "DESTINATION REACHED. Bankroll secured.";
            document.getElementById('milestone-msg').textContent = msg;
        }

        function closeMilestone() { document.getElementById('milestone-modal').style.display = 'none'; }
        
        function showView(v) {
            ['execution', 'stats', 'settings'].forEach(id => document.getElementById('view-'+id).classList.add('hidden'));
            document.getElementById('view-'+v).classList.remove('hidden');
            updateUI();
        }

        function save() { localStorage.setItem('aq_v14', JSON.stringify({bankroll, startBank, target, ratio, milestonesReached, tradeLog})); }
        window.onload = () => {
            let s = JSON.parse(localStorage.getItem('aq_v14'));
            if(s) { 
                Object.assign(window, s); 
                document.getElementById('set-start').value = startBank;
                document.getElementById('set-target').value = target;
            }
            updateUI();
        };
        function saveSettings() {
            startBank = parseFloat(document.getElementById('set-start').value);
            target = parseFloat(document.getElementById('set-target').value);
            ratio = parseFloat(document.getElementById('set-ratio').value);
            bankroll = startBank;
            tradeLog = [];
            milestonesReached = [];
            save();
            updateUI();
            showView('execution');
        }
    </script>
</body>
</html>
