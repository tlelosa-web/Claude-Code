<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>✈️ AviatorQuest - Pilot v1.3</title>
    <style>
        :root {
            --primary: #ef4444; 
            --secondary: #10b981; 
            --accent: #fbbf24;
            --bg: #0f172a;
            --panel: #1e293b;
            --text: #f8fafc;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body.theme-space {
            --primary: #a855f7; 
            --secondary: #22d3ee; 
            --bg: #020617;
            --panel: #1e1b4b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 15px;
            transition: background 0.3s ease;
        }

        .container { width: 100%; max-width: 500px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 15px; }
        .rank-badge { font-size: 10px; font-weight: 900; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }
        
        .nav-bar { display: flex; gap: 5px; margin-bottom: 15px; background: rgba(0,0,0,0.2); padding: 4px; border-radius: 10px; }
        .nav-btn { flex: 1; padding: 10px; border: none; border-radius: 6px; background: transparent; color: #64748b; font-weight: 700; cursor: pointer; }
        .nav-btn.active { background: var(--panel); color: white; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }

        .cockpit-panel { background: var(--panel); border-radius: 20px; padding: 18px; border: 1px solid var(--glass); box-shadow: 0 10px 30px rgba(0,0,0,0.5); margin-bottom: 15px; }

        /* Mission Intel Grid */
        .intel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .intel-box { background: rgba(0,0,0,0.2); padding: 12px; border-radius: 12px; border: 1px solid var(--glass); }
        .intel-label { font-size: 9px; color: #94a3b8; text-transform: uppercase; font-weight: 800; display: block; margin-bottom: 4px;}
        .intel-val { font-size: 16px; font-weight: 800; color: #fff; }

        .progress-track { height: 8px; background: #000; border-radius: 10px; margin: 10px 0; overflow: hidden; border: 1px solid var(--glass); }
        .progress-bar { height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); width: 0%; transition: 1s; }

        /* Execution View */
        .bet-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .bet-card { background: rgba(15, 23, 42, 0.4); padding: 12px; border-radius: 15px; border: 1px solid var(--glass); }
        .bet-card label { display: block; font-size: 10px; font-weight: 800; color: #94a3b8; margin-bottom: 4px; }
        .unit-input { width: 100%; background: transparent; border: none; color: white; font-size: 20px; font-weight: 800; outline: none; }
        .auto-cash-input { width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--glass); color: var(--accent); padding: 4px; border-radius: 4px; font-size: 12px; font-weight: 700; margin-top: 5px; text-align: center; }

        .btn-action { width: 100%; padding: 16px; border-radius: 12px; border: none; font-weight: 900; text-transform: uppercase; cursor: pointer; transition: 0.1s; }
        .btn-cashout { background: var(--secondary); color: #064e3b; margin-top: 8px; font-size: 12px; }
        .btn-crash { background: var(--primary); color: white; font-size: 18px; box-shadow: 0 4px 0 #991b1b; }
        .btn-action:active { transform: translateY(2px); box-shadow: none; }
        .btn-disabled { opacity: 0.3; pointer-events: none; filter: grayscale(1); }

        /* Config Grid */
        .config-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--glass); }
        .config-row label { font-size: 12px; font-weight: 700; color: #94a3b8; text-align: left; }
        .config-row input, .config-row select { width: 130px; padding: 6px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; text-align: right; }

        .log-item { display: flex; justify-content: space-between; padding: 10px; background: var(--glass); border-radius: 8px; margin-bottom: 5px; font-size: 13px; }
        .hidden { display: none; }
    </style>
</head>
<body id="body-main">

    <div class="container">
        <header>
            <div class="rank-badge" id="pilot-rank">Rookie Pilot</div>
            <h1 id="game-title">✈️ AVIATOR QUEST</h1>
        </header>

        <nav class="nav-bar">
            <button class="nav-btn active" onclick="showView('execution')">COCKPIT</button>
            <button class="nav-btn" onclick="showView('stats')">JOURNAL</button>
            <button class="nav-btn" onclick="showView('settings')">MISSION CONFIG</button>
        </nav>

        <div class="cockpit-panel">
            <div class="intel-grid">
                <div class="intel-box">
                    <span class="intel-label">Current Bankroll</span>
                    <span class="intel-val" id="total-bankroll" style="color:var(--secondary)">R0.00</span>
                </div>
                <div class="intel-box">
                    <span class="intel-label">Daily Profit Target</span>
                    <span class="intel-val" id="daily-target" style="color:var(--accent)">R0.00</span>
                </div>
                <div class="intel-box">
                    <span class="intel-label">Projected Arrival</span>
                    <span class="intel-val" id="projected-date" style="font-size:12px">--/--/--</span>
                </div>
                <div class="intel-box">
                    <span class="intel-label">Days to Target</span>
                    <span class="intel-val" id="days-remaining">0</span>
                </div>
            </div>
            <div class="progress-track"><div class="progress-bar" id="main-progress"></div></div>
            <div style="display:flex; justify-content: space-between; font-size: 10px; font-weight: 800; color: #64748b;">
                <span id="prog-detail">0% COMPLETED</span>
                <span id="total-stake">STAKE: R0.00</span>
            </div>
        </div>

        <div id="view-execution" class="view-content">
            <div class="bet-grid">
                <div class="bet-card">
                    <label>BET A (UNITS)</label>
                    <input type="number" id="unit-a" class="unit-input" value="2" oninput="handleBetAInput()">
                    <div class="intel-label" id="cash-a-val">R0.00</div>
                    <input type="number" id="auto-a" class="auto-cash-input" value="1.50" step="0.1">
                    <button class="btn-action btn-cashout" id="btn-cash-a" onclick="cashout(1)">CASHOUT A</button>
                </div>
                <div class="bet-card">
                    <label>BET B (UNITS)</label>
                    <input type="number" id="unit-b" class="unit-input" value="1" oninput="calculateStakes()">
                    <div class="intel-label" id="cash-b-val">R0.00</div>
                    <input type="number" id="auto-b" class="auto-cash-input" value="5.00" step="0.1">
                    <button class="btn-action btn-cashout" id="btn-cash-b" onclick="cashout(2)">CASHOUT B</button>
                </div>
            </div>
            <button class="btn-action btn-crash" onclick="crash()">CRASH</button>
        </div>

        <div id="view-stats" class="view-content hidden">
            <div class="cockpit-panel">
                <h3 style="margin-bottom:10px; font-size:14px; color:var(--accent)">📜 RECENT FLIGHTS</h3>
                <div id="log-list"></div>
            </div>
        </div>

        <div id="view-settings" class="view-content hidden">
            <div class="cockpit-panel">
                <h3 style="margin-bottom:15px; font-size:14px;">MISSION LOGISTICS</h3>
                
                <div class="config-row"><label>Opening Bankroll (R)</label><input type="number" id="set-start" value="1000"></div>
                <div class="config-row"><label>Mission Goal (R)</label><input type="number" id="set-target" value="10000"></div>
                <div class="config-row"><label>Mission Start Date</label><input type="date" id="set-start-date"></div>
                <div class="config-row"><label>Unit Risk %</label><input type="number" id="set-unit-pct" value="1"></div>
                <div class="config-row"><label>Auto-Set B % of A</label><input type="number" id="set-auto-b-pct" value="50"></div>
                <div class="config-row">
                    <label>Game Aesthetic</label>
                    <select id="set-theme" onchange="applyTheme()">
                        <option value="aviator">Classic Aviator</option>
                        <option value="space">Space Crash</option>
                    </select>
                </div>

                <button class="btn-action btn-cashout" onclick="applySettings()" style="background: var(--secondary); color: #000; margin-top:10px;">SAVE MISSION DATA</button>
                <button class="btn-action" onclick="resetBankroll()" style="background: #334155; color: #fff; padding: 10px; font-size: 11px;">RESET ALL PROGRESS</button>
            </div>
        </div>
    </div>

    <script>
        let bankroll = 1000, startBankroll = 1000, targetGoal = 10000, unitPct = 1;
        let startDate = new Date().toISOString().split('T')[0];
        let autoBPct = 50, wins = 0, roundCounter = 1, tradeLog = [];
        let betAActive = true, betBActive = true, roundProfit = 0;

        function showView(name) {
            document.querySelectorAll('.view-content').forEach(v => v.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('view-' + name).classList.remove('hidden');
            if (event) event.target.classList.add('active');
        }

        function handleBetAInput() {
            const aVal = parseFloat(document.getElementById('unit-a').value) || 0;
            document.getElementById('unit-b').value = (aVal * (autoBPct / 100)).toFixed(2);
            calculateStakes();
        }

        function calculateStakes() {
            const unitVal = (bankroll * (unitPct / 100));
            const uA = parseFloat(document.getElementById('unit-a').value) || 0;
            const uB = parseFloat(document.getElementById('unit-b').value) || 0;
            const total = (uA + uB) * unitVal;
            
            document.getElementById('total-bankroll').textContent = 'R' + bankroll.toFixed(2);
            document.getElementById('total-stake').textContent = 'STAKE: R' + total.toFixed(2);
            document.getElementById('cash-a-val').textContent = 'R' + (uA * unitVal).toFixed(2);
            document.getElementById('cash-b-val').textContent = 'R' + (uB * unitVal).toFixed(2);
        }

        function updateTimeline() {
            const now = new Date();
            const start = new Date(startDate);
            const diffTime = Math.abs(now - start);
            const daysPassed = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) || 1;

            const totalProfitToDate = bankroll - startBankroll;
            const avgDailyProfit = totalProfitToDate / daysPassed;
            const remainingProfitNeeded = targetGoal - bankroll;

            let daysToGoal = 0;
            let projectedCompletion = "N/A";

            if (avgDailyProfit > 0) {
                daysToGoal = Math.ceil(remainingProfitNeeded / avgDailyProfit);
                const arrivalDate = new Date();
                arrivalDate.setDate(now.getDate() + daysToGoal);
                projectedCompletion = arrivalDate.toLocaleDateString();
            }

            document.getElementById('daily-target').textContent = 'R' + (remainingProfitNeeded / 30).toFixed(2); // Estimated daily need for 30-day window
            document.getElementById('days-remaining').textContent = daysToGoal > 0 ? daysToGoal : "∞";
            document.getElementById('projected-date').textContent = projectedCompletion;

            const progress = ((bankroll - startBankroll) / (targetGoal - startBankroll)) * 100;
            const cp = Math.max(0, Math.min(progress, 100));
            document.getElementById('main-progress').style.width = cp + '%';
            document.getElementById('prog-detail').textContent = cp.toFixed(1) + '% COMPLETED';
        }

        function cashout(num) {
            const autoVal = parseFloat(document.getElementById(num === 1 ? 'auto-a' : 'auto-b').value);
            const mult = prompt(`Cashout Multiplier for Bet ${num === 1 ? 'A' : 'B'}?`, autoVal);
            if (!mult || isNaN(mult)) return;

            const unitVal = (bankroll * (unitPct / 100));
            if (num === 2 && betAActive) {
                const aAuto = parseFloat(document.getElementById('auto-a').value);
                roundProfit += (parseFloat(document.getElementById('unit-a').value) * unitVal * aAuto) - (parseFloat(document.getElementById('unit-a').value) * unitVal);
                betAActive = false;
                document.getElementById('btn-cash-a').classList.add('btn-disabled');
            }

            const stake = (num === 1 ? parseFloat(document.getElementById('unit-a').value) : parseFloat(document.getElementById('unit-b').value)) * unitVal;
            roundProfit += (stake * mult) - stake;

            if (num === 1) { betAActive = false; document.getElementById('btn-cash-a').classList.add('btn-disabled'); }
            else { betBActive = false; document.getElementById('btn-cash-b').classList.add('btn-disabled'); }

            if (!betAActive && !betBActive) finalize("WIN");
        }

        function crash() {
            const unitVal = (bankroll * (unitPct / 100));
            const uA = betAActive ? parseFloat(document.getElementById('unit-a').value) || 0 : 0;
            const uB = betBActive ? parseFloat(document.getElementById('unit-b').value) || 0 : 0;
            roundProfit -= (uA + uB) * unitVal;
            finalize("CRASH");
        }

        function finalize(status) {
            bankroll += roundProfit;
            if (roundProfit > 0) wins++;
            tradeLog.push({ id: roundCounter++, status, profit: roundProfit, bal: bankroll });
            roundProfit = 0; betAActive = true; betBActive = true;
            document.querySelectorAll('.btn-cashout').forEach(b => b.classList.remove('btn-disabled'));
            updateUI();
        }

        function applyTheme() {
            const theme = document.getElementById('set-theme').value;
            document.getElementById('body-main').className = (theme === 'space' ? 'theme-space' : '');
            document.getElementById('game-title').textContent = (theme === 'space' ? '🚀 SPACE CRASH' : '✈️ AVIATOR QUEST');
        }

        function updateUI() {
            updateTimeline();
            renderLog();
            calculateStakes();
            saveData();
        }

        function renderLog() {
            document.getElementById('log-list').innerHTML = tradeLog.slice().reverse().map(l => `
                <div class="log-item"><span>#${l.id} ${l.status}</span><span style="color:${l.profit > 0 ? 'var(--secondary)' : 'var(--primary)'}">${l.profit > 0 ? '+' : ''}R${l.profit.toFixed(2)}</span></div>
            `).join('');
        }

        function applySettings() {
            bankroll = parseFloat(document.getElementById('set-start').value);
            startBankroll = bankroll;
            targetGoal = parseFloat(document.getElementById('set-target').value);
            startDate = document.getElementById('set-start-date').value;
            unitPct = parseFloat(document.getElementById('set-unit-pct').value);
            autoBPct = parseFloat(document.getElementById('set-auto-b-pct').value);
            applyTheme();
            updateUI();
            showView('execution');
        }

        function saveData() {
            const data = { bankroll, startBankroll, targetGoal, unitPct, autoBPct, tradeLog, wins, roundCounter, startDate };
            localStorage.setItem('aviatorPilot_v13', JSON.stringify(data));
        }

        window.onload = () => {
            const saved = localStorage.getItem('aviatorPilot_v13');
            if (saved) {
                const d = JSON.parse(saved);
                Object.assign(window, d);
                document.getElementById('set-start').value = startBankroll;
                document.getElementById('set-target').value = targetGoal;
                document.getElementById('set-start-date').value = startDate;
            } else {
                document.getElementById('set-start-date').value = new Date().toISOString().split('T')[0];
            }
            updateUI();
        };

        function resetBankroll() { if (confirm("Abort mission and wipe data?")) { localStorage.removeItem('aviatorPilot_v13'); location.reload(); } }
    </script>
</body>
</html>
