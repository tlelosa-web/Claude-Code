<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Clash Sequence Tracker</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-950 text-white font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [startWin, setStartWin] = useState(() => localStorage.getItem('f1_start_win') || "");
            const [history, setHistory] = useState(() => JSON.parse(localStorage.getItem('f1_pro_history')) || []);

            useEffect(() => {
                localStorage.setItem('f1_start_win', startWin);
                localStorage.setItem('f1_pro_history', JSON.stringify(history));
            }, [startWin, history]);

            const addCrate = (type) => {
                if (!startWin) return alert("Enter your last P/L win count first!");
                // Add new entry to history
                setHistory([...history, type]);
            };

            const reset = () => {
                if(confirm("Reset all tracking data?")) {
                    setHistory([]);
                    setStartWin("");
                }
            };

            // Logic to get last 8 entries and reverse them for "Latest at Top"
            const lastEight = history.slice(-8).map((type, index) => {
                const globalIndex = history.length - (history.slice(-8).length - index);
                return {
                    winNum: parseInt(startWin) + globalIndex + 1,
                    type: type
                };
            }).reverse();

            const currentWin = startWin ? parseInt(startWin) + history.length : "---";

            return (
                <div className="min-h-screen flex flex-col items-center p-4">
                    <div className="w-full max-w-md bg-slate-900 rounded-3xl border border-slate-800 shadow-2xl overflow-hidden">
                        
                        {/* Header */}
                        <div className="bg-gradient-to-b from-red-600 to-red-700 p-6 text-center border-b border-red-500/20">
                            <h1 className="text-xl font-black uppercase italic tracking-tighter">Crate Predictor</h1>
                            <div className="flex justify-center items-center gap-2 mt-2">
                                <span className="text-[10px] bg-black/30 px-2 py-0.5 rounded text-red-200 font-mono">
                                    CURRENT WIN: {currentWin}
                                </span>
                            </div>
                        </div>

                        <div className="p-6 space-y-5">
                            {/* Anchor Point Input */}
                            {!startWin ? (
                                <div className="bg-slate-800/50 p-4 rounded-xl border border-blue-500/30">
                                    <label className="block text-[10px] font-bold text-blue-400 mb-2 uppercase tracking-widest">Initial Reference (Last P/L Win)</label>
                                    <input 
                                        type="number" 
                                        placeholder="e.g. 4436" 
                                        className="w-full bg-slate-950 p-3 rounded-lg border border-slate-700 text-white font-mono focus:border-blue-500 outline-none"
                                        onKeyDown={(e) => e.key === 'Enter' && setStartWin(e.target.value)}
                                        onBlur={(e) => setStartWin(e.target.value)}
                                    />
                                </div>
                            ) : (
                                <div className="flex justify-between items-center bg-slate-800/30 p-3 rounded-xl border border-slate-700">
                                    <span className="text-xs text-slate-400 uppercase font-bold">Anchor Point: <span className="text-white ml-2">{startWin}</span></span>
                                    <button onClick={() => setStartWin("")} className="text-[10px] text-red-400 font-bold hover:text-red-300 transition">EDIT</button>
                                </div>
                            )}

                            {/* Recent Wins Log (Latest at Top) */}
                            <div className="space-y-1">
                                <p className="text-[10px] font-bold text-slate-500 uppercase mb-2">Recent Activity (Last 8)</p>
                                <div className="min-h-[280px]">
                                    {lastEight.length > 0 ? lastEight.map((item, i) => (
                                        <div key={i} className={`flex justify-between items-center p-3 rounded-lg mb-1 ${i === 0 ? 'bg-slate-800 border-l-4 border-blue-500' : 'bg-slate-900/50 border-l-4 border-transparent opacity-60'}`}>
                                            <div className="flex items-center gap-3">
                                                <span className="font-mono text-sm text-slate-400">#{item.winNum}</span>
                                                {i === 0 && <span className="text-[9px] bg-blue-500/20 text-blue-400 px-1 rounded font-bold uppercase">Latest</span>}
                                            </div>
                                            <span className={`font-black text-sm ${
                                                item.type === 'P/L' ? 'text-yellow-500' : 
                                                item.type === 'G' ? 'text-blue-400' : 
                                                item.type === 'GP' ? 'text-green-400' : 'text-slate-500'
                                            }`}>
                                                {item.type}
                                            </span>
                                        </div>
                                    )) : (
                                        <div className="h-40 flex items-center justify-center text-slate-700 italic text-sm">No wins logged yet</div>
                                    )}
                                </div>
                            </div>

                            {/* Controls */}
                            <div className="grid grid-cols-2 gap-2">
                                <button onClick={() => addCrate('S')} className="bg-slate-800 hover:bg-slate-700 py-3 rounded-lg font-bold text-xs transition-transform active:scale-95">S</button>
                                <button onClick={() => addCrate('G')} className="bg-blue-900/40 hover:bg-blue-900/60 border border-blue-500/50 py-3 rounded-lg font-bold text-xs transition-transform active:scale-95 text-blue-400">GOLD (G)</button>
                                <button onClick={() => addCrate('GP')} className="bg-green-900/40 hover:bg-green-900/60 border border-green-500/50 py-3 rounded-lg font-bold text-xs transition-transform active:scale-95 text-green-400">GP WIN</button>
                                <button onClick={() => addCrate('P/L')} className="bg-yellow-500 hover:bg-yellow-400 py-3 rounded-lg font-bold text-xs text-black transition-transform active:scale-95">PREMIUM (P/L)</button>
                            </div>

                            <button onClick={reset} className="w-full text-slate-600 hover:text-red-500 text-[10px] font-bold uppercase tracking-widest mt-4">
                                Clear Sequence
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
