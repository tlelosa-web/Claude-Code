<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>✈️ AviatorQuest Pilot v1.6</title>
    <style>
        :root {
            --primary: #ef4444; --secondary: #10b981; --accent: #fbbf24;
            --bg: #0f172a; --panel: #1e293b; --text: #f8fafc; --glass: rgba(255, 255, 255, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 480px; }

        /* Tactical Animations */
        @keyframes crash-shake { 0% { transform: translate(2px, 1px); } 20% { transform: translate(-3px, -2px); } 100% { transform: translate(0,0); } }
        .crash-shake { animation: crash-shake 0.2s ease-in-out infinite; background: rgba(239, 68, 68, 0.2) !important; }
        .tap-pulse { transform: scale(0.95); background: var(--accent) !important; color: #000 !important; }

        header { text-align: center; margin-bottom: 15px; }
        .pilot-tag { font-size: 10px; font-weight: 900; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }
        
        .nav-bar { display: flex; gap: 8px; margin-bottom: 15px; background: rgba(0,0,0,0.3); padding: 6px; border-radius: 16px; backdrop-filter: blur(10px); }
        .nav-btn { flex: 1; padding: 12px; border: none; border-radius: 12px; background: transparent; color: #64748b; font-weight: 800; font-size: 11px; cursor: pointer; }
        .nav-btn.active { background: var(--panel); color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.4); border: 1px solid var(--glass); }

        .cockpit-panel { background: var(--panel); border-radius: 24px; padding: 20px; border: 1px solid var(--glass); margin-bottom: 15px; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        /* Intel Grid */
        .intel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .intel-box { background: rgba(0,0,0,0.2); padding: 12px; border-radius: 16px; text-align: center; border: 1px solid var(--glass); }
        .intel-label { font-size: 9px; color: #94a3b8; text-transform: uppercase; font-weight: 900; margin-bottom: 4px; display: block; }
        .intel-val { font-size: 16px; font-weight: 900; }

        /* Progress HUD */
        .progress-ring-container { position: relative; width: 100px; height: 100px; margin: 0 auto 15px; }
        .progress-ring__circle { transition: stroke-dashoffset 0.8s ease; stroke: #0f172a; }
        .progress-ring__fill { stroke: var(--accent); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
        .progress-ring-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-weight: 900; font-size: 18px; color: #fff; }

        /* Execution Deck */
        .bet-deck { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; position: relative; }
        .bet-card { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 20px; border: 1px solid var(--glass); text-align: center; }
        .unit-input { width: 100%; background: transparent; border: none; color: white; font-size: 26px; font-weight: 900; text-align: center; outline: none; }
        
        .quick-taps { display: flex; gap: 4px; margin: 10px 0; }
        .tap-btn { flex: 1; padding: 8px 0; font-size: 10px; background: var(--glass); border: none; color: white; border-radius: 8px; font-weight: 900; cursor: pointer; }

        .safety-bracket { position: absolute; top: 115px; left: 50%; transform: translateX(-50%); width: 70px; height: 15px; border: 2px solid var(--secondary); border-top: none; border-radius: 0 0 12px 12px; display: none; z-index: 10; }

        .btn-action { width: 100%; padding: 16px; border-radius: 14px; border: none; font-weight: 900; text-transform: uppercase; cursor: pointer; transition: 0.1s; }
        .btn-cashout { background: var(--secondary); color: #064e3b; margin-top: 5px; font-size: 12px; }
        .btn-crash { background: var(--primary); color: white; font-size: 20px; margin-top: 10px; box-shadow: 0 6px 0 #991b1b; }
        .btn-save-vault { background: var(--accent); color: #0f172a; margin-top: 15px; }

        /* History & Config */
        .log-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid var(--glass); font-size: 12px; }
        .config-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .config-row input { width: 140px; padding: 10px; background: #000; border: 1px solid var(--glass); color: white; border-radius: 10px; text-align: right; }

        #milestone-modal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.98); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 2000; text-align: center; padding: 40px; }
        .hidden { display: none; }
    </style>
</head>
<body id="main-body">

    <div class="container">
        <header>
            <div class="pilot-tag" id="rank-text">ROOKIE PILOT</div>
            <h1 style="letter-spacing: -1px;">AVIATOR QUEST <span style="font-size: 12px; color: var(--accent);">v1.6</span></h1>
        </header>

        <nav class="nav-bar">
            <button class="nav-btn active" onclick="showView('cockpit', this)">COCKPIT</button>
            <button class="nav-btn" onclick="showView('log', this)">LOGS</button>
            <button class="nav-btn" onclick="showView('config', this)">CONFIG</button>
        </nav>

        <div class="cockpit-panel">
            <div class="progress-ring-container">
                <svg width="100" height="100">
                    <circle class="progress-ring__circle" stroke-width="6" fill="transparent" r="45" cx="50" cy="50"/>
                    <circle class="progress-ring__fill" id="ring-fill" stroke-width="6" stroke-dasharray="282.7" stroke-dashoffset="282.7" fill="transparent" r="45" cx="50" cy="50" stroke="var(--accent)"/>
                </svg>
                <div class="progress-ring-text" id="prog-pct">0%</div>
            </div>

            <div class="intel-grid">
                <div class="intel-box"><span class="intel-label">Account</span><span class="intel-val" id="disp-bank">R0</span></div>
                <div class="intel-box"><span class="intel-label">Vault</span><span class="intel-val" id="disp-vault" style="color:var(--secondary)">R0</span></div>
                <div class="intel-box"><span class="intel-label">Mission Day</span><span class="intel-val" id="disp-day">1</span></div>
                <div class="intel-box"><span class="intel-label">Daily Goal</span><span class="intel-val" id="disp-goal" style="color:var(--accent)">R0</span></div>
            </div>
        </div>

        <div id="view-cockpit">
            <div class="bet-deck">
                <div class="safety-bracket" id="bracket"></div>
                
                <div class="bet-card">
                    <span class="intel-label">Bet A (Units)</span>
                    <input type="number" id="unit-a" class="unit-input" value="2" oninput="calculateFlight()">
                    <div class="quick-taps">
                        <button class="tap-btn" onclick="quickCash(1, 2.0, this)">2.0x</button>
                        <button class="tap-btn" onclick="quickCash(1, 2.5, this)">2.5x</button>
                    </div>
                    <div style="font-size: 9px; color: var(--accent); margin-bottom: 5px;">AUTO-A: <input type="number" id="auto-a" value="1.5" step="0.1" style="width:30px; background:none; border:none; color:inherit; font-weight:900;">x</div>
                    <button class="btn-action btn-cashout" id="btn-a" onclick="cashout(1)">CASHOUT A</button>
                </div>

                <div class="bet-card">
                    <span class="intel-label">Bet B (Units)</span>
                    <input type="number" id="unit-b" class="unit-input" value="1" oninput="calculateFlight()">
                    <div class="quick-taps">
                        <button class="tap-btn" onclick="quickCash(2, 2.0, this)">2.0x</button>
                        <button class="tap-btn" onclick="quickCash(2, 2.5, this)">2.5x</button>
                    </div>
                    <div id="disp-stake" style="font-size:9px; color:#94a3b8; font-weight:900;">STAKE: R0.00</div>
                    <button class="btn-action btn-cashout" id="btn-b" onclick="cashout(2)">CASHOUT B</button>
                </div>
            </div>
            <button class="btn-action btn-crash" onclick="triggerCrash()">CRASH</button>
            <button class="btn-action btn-save-vault" id="btn-vault" onclick="saveToVault()">💰 SAVE VAULT PROFIT</button>
        </div>

        <div id="view-log" class="hidden">
            <div class="cockpit-panel" id="log-list" style="max-height: 350px; overflow-y: auto;"></div>
        </div>

        <div id="view-config" class="hidden">
            <div class="cockpit-panel">
                <div class="config-row"><label>Start Bankroll</label><input type="number" id="set-start" value="1000"></div>
                <div class="config-row"><label>Target Goal</label><input type="number" id="set-target" value="10000"></div>
                <div class="config-row"><label>Quest Start Date</label><input type="date" id="set-date"></div>
                <div class="config-row"><label>Save Target %</label><input type="number" id="set-save-pct" value="50"></div>
                <button class="btn-action btn-cashout" onclick="saveSettings()" style="background:var(--accent); color:#000; margin-top:10px;">SAVE PARAMETERS</button>
                <button onclick="purge()" style="width:100%; margin-top:20px; background:none; border:none; color:var(--primary); font-size:10px; font-weight:900; cursor:pointer;">PURGE ALL DATA</button>
            </div>
        </div>
    </div>

    <div id="milestone-modal">
        <div style="font-size: 60px;">🚀</div>
        <h2 id="m-title">MILESTONE</h2>
        <p id="m-msg" style="margin: 20px 0; color: #94a3b8; line-height: 1.5;"></p>
        <button class="btn-action btn-cashout" onclick="closeM()">RESUME MISSION</button>
    </div>

    <script>
        let state = {
            bankroll: 1000, vault: 0, startBank: 1000, target: 10000, savePct: 50,
            startDate: new Date().toISOString().split('T')[0],
            log: [], milestones: []
        };

        let aActive = true, bActive = true, roundProfit = 0, currentUnit = 0;

        function calculateFlight() {
            currentUnit = state.bankroll * 0.01;
            let uA = parseFloat(document.getElementById('unit-a').value) || 0;
            let uB = parseFloat(document.getElementById('unit-b').value) || 0;
            let autoA = parseFloat(document.getElementById('auto-a').value) || 1.5;
            let stake = (uA + uB) * currentUnit;

            document.getElementById('disp-bank').textContent = 'R' + state.bankroll.toFixed(0);
            document.getElementById('disp-vault').textContent = 'R' + state.vault.toFixed(0);
            document.getElementById('disp-stake').textContent = 'STAKE: R' + stake.toFixed(2);

            // Safety Bracket Logic
            if ((uA * currentUnit * autoA) >= stake && uA > 0) {
                document.getElementById('bracket').style.display = 'block';
            } else {
                document.getElementById('bracket').style.display = 'none';
            }
        }

        function cashout(num, multInput = null) {
            let mult = multInput || prompt("Multiplier?", "2.0");
            if (!mult) return;

            // Secure A automatically if B is cashed
            if (num === 2 && aActive) {
                let autoA = parseFloat(document.getElementById('auto-a').value);
                let stakeA = parseFloat(document.getElementById('unit-a').value) * currentUnit;
                roundProfit += (stakeA * autoA) - stakeA;
                aActive = false;
                document.getElementById('btn-a').classList.add('hidden');
            }

            let stake = parseFloat(document.getElementById(num === 1 ? 'unit-a' : 'unit-b').value) * currentUnit;
            roundProfit += (stake * mult) - stake;
            
            if (num === 1) { aActive = false; document.getElementById('btn-a').classList.add('hidden'); }
            else { bActive = false; document.getElementById('btn-b').classList.add('hidden'); }

            if (!aActive && !bActive) finalize("WIN");
        }

        function quickCash(n, m, el) {
            el.classList.add('tap-pulse');
            setTimeout(() => el.classList.remove('tap-pulse'), 150);
            cashout(n, m);
        }

        function triggerCrash() {
            document.body.classList.add('crash-shake');
            setTimeout(() => document.body.classList.remove('crash-shake'), 400);
            let loss = 0;
            if (aActive) loss += parseFloat(document.getElementById('unit-a').value) * currentUnit;
            if (bActive) loss += parseFloat(document.getElementById('unit-b').value) * currentUnit;
            roundProfit = -loss;
            finalize("CRASH");
        }

        function saveToVault() {
            let totalWealth = state.bankroll + state.vault;
            let profit = totalWealth - state.startBank;
            if (profit <= 0) return;
            
            let amt = profit * (state.savePct / 100);
            state.vault += amt;
            state.bankroll -= amt;
            state.log.push({ res: "VAULT", p: -amt, b: state.bankroll, t: new Date().toLocaleTimeString() });
            updateUI();
            save();
        }

        function finalize(res) {
            state.bankroll += roundProfit;
            state.log.push({ res, p: roundProfit, b: state.bankroll, t: new Date().toLocaleTimeString() });
            roundProfit = 0; aActive = true; bActive = true;
            document.getElementById('btn-a').classList.remove('hidden');
            document.getElementById('btn-b').classList.remove('hidden');
            updateUI();
            save();
        }

        function updateUI() {
            let totalWealth = state.bankroll + state.vault;
            let prog = ((totalWealth - state.startBank) / (state.target - state.startBank)) * 100;
            let cp = Math.max(0, Math.min(prog, 100));
            
            // HUD Update
            document.getElementById('prog-pct').textContent = cp.toFixed(1) + '%';
            document.getElementById('ring-fill').style.strokeDashoffset = 282.7 - (282.7 * (cp/100));
            
            let days = Math.ceil((new Date() - new Date(state.startDate)) / 86400000) || 1;
            document.getElementById('disp-day').textContent = days;
            
            // Goal Logic
            let idealRate = Math.pow(state.target / state.startBank, 1 / 30) - 1;
            let targetToday = state.startBank * Math.pow(1 + idealRate, days);
            document.getElementById('disp-goal').textContent = 'R' + targetToday.toFixed(0);

            // Vault Visibility
            document.getElementById('btn-vault').disabled = (totalWealth <= state.startBank);

            // Milestones
            [25, 50, 75, 100].forEach(m => {
                if (cp >= m && !state.milestones.includes(m)) {
                    state.milestones.push(m);
                    showM(m);
                }
            });

            renderLog();
            calculateFlight();
        }

        function renderLog() {
            document.getElementById('log-list').innerHTML = state.log.slice().reverse().map(l => `
                <div class="log-item">
                    <span><b>${l.res}</b> <small>${l.t}</small></span>
                    <span style="color:${l.p >= 0 ? 'var(--secondary)' : 'var(--primary)'}; font-weight:900;">${l.p >= 0 ? '+' : ''}R${l.p.toFixed(2)}</span>
                </div>
            `).join('');
        }

        function showM(m) {
            document.getElementById('milestone-modal').style.display = 'flex';
            document.getElementById('m-title').textContent = m + '% MISSION COMPLETE';
            document.getElementById('m-msg').textContent = m === 50 ? "HALF-WAY! Use the Vault button to secure your starting capital." : "Elite flying. Stay the course.";
        }
        function closeM() { document.getElementById('milestone-modal').style.display = 'none'; }

        function showView(v, el) {
            ['cockpit', 'log', 'config'].forEach(i => document.getElementById('view-'+i).classList.add('hidden'));
            document.getElementById('view-'+v).classList.remove('hidden');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        function save() { localStorage.setItem('aq_v16_deploy', JSON.stringify(state)); }
        function saveSettings() {
            state.startBank = parseFloat(document.getElementById('set-start').value);
            state.target = parseFloat(document.getElementById('set-target').value);
            state.startDate = document.getElementById('set-date').value;
            state.savePct = parseFloat(document.getElementById('set-save-pct').value);
            updateUI();
            showView('cockpit', document.querySelector('.nav-btn'));
        }

        window.onload = () => {
            let s = JSON.parse(localStorage.getItem('aq_v16_deploy'));
            if (s) state = s;
            document.getElementById('set-start').value = state.startBank;
            document.getElementById('set-target').value = state.target;
            document.getElementById('set-date').value = state.startDate;
            document.getElementById('set-save-pct').value = state.savePct;
            updateUI();
        };
        function purge() { if(confirm("Purge all mission data?")) { localStorage.removeItem('aq_v16_deploy'); location.reload(); } }
    </script>
</body>
</html>
