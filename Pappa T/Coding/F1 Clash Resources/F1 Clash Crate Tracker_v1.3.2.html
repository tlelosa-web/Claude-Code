<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>F1 Clash Tracker</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #020617; }
        .btn-active:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const STEPS = {
            1: { p: 12, g: [4, 8] },
            2: { p: 24, g: [5, 10, 15, 20] },
            3: { p: 25, g: [5, 8, 12, 16, 20, 24] },
            4: { p: 40, g: [8, 16, 24, 32] },
            5: { p: 32, g: [6, 12, 18, 24] },
            6: { p: 48, g: [8, 16, 24, 32, 40] },
            7: { p: 24, g: [5, 10, 15, 20] },
            8: { p: 24, g: [4, 8, 12, 16, 20] }
        };

        const App = () => {
            const [anchor, setAnchor] = useState(() => localStorage.getItem('f1_v5_anchor') || "4436");
            const [activeStep, setActiveStep] = useState(() => parseInt(localStorage.getItem('f1_v5_step')) || 3);
            const [history, setHistory] = useState(() => JSON.parse(localStorage.getItem('f1_v5_history')) || []);

            useEffect(() => {
                localStorage.setItem('f1_v5_anchor', anchor);
                localStorage.setItem('f1_v5_step', activeStep);
                localStorage.setItem('f1_v5_history', JSON.stringify(history));
            }, [anchor, activeStep, history]);

            const currentWin = parseInt(anchor) + history.length;
            const addCrate = (type) => setHistory([...history, type]);

            const getExpected = (winNum) => {
                const totalOffset = winNum - parseInt(anchor);
                const pastGPs = history.slice(0, totalOffset).filter(x => x === 'GP').length;
                const rc = totalOffset - pastGPs; 
                if (rc <= 0) return 'GP/REF';
                const pattern = STEPS[activeStep];
                if (rc === pattern.p) return 'PREM';
                return pattern.g.includes(rc) ? 'GOLD' : 'S/F';
            };

            const display = [];
            // Last 1 logged and next 4 predicted (5 total rows)
            for (let i = history.length - 1; i >= Math.max(0, history.length - 1); i--) {
                display.push({ w: parseInt(anchor)+i+1, act: history[i], exp: getExpected(parseInt(anchor)+i+1), type: 'past' });
            }
            for (let i = history.length; i < history.length + 4; i++) {
                display.push({ w: parseInt(anchor)+i+1, act: null, exp: getExpected(parseInt(anchor)+i+1), type: 'future' });
            }

            return (
                <div className="flex flex-col h-screen max-w-sm mx-auto bg-slate-900 shadow-2xl overflow-hidden border-x border-slate-800">
                    {/* Compact Header row */}
                    <div className="bg-red-700 p-1.5 flex justify-between items-center text-white px-3">
                        <span className="text-[10px] font-black italic">STEP {activeStep}</span>
                        <div className="flex items-center gap-2">
                            <span className="text-[10px] font-mono">WIN: {currentWin}</span>
                            <select value={activeStep} onChange={(e) => setActiveStep(parseInt(e.target.value))} className="bg-black/40 text-[9px] rounded px-1 outline-none">
                                {[1,2,3,4,5,6,7,8].map(s => <option key={s} value={s}>S{s}</option>)}
                            </select>
                        </div>
                    </div>

                    {/* Sub-header */}
                    <div className="flex justify-between items-center px-3 py-1 bg-slate-800 text-[9px] border-b border-slate-700 text-slate-300">
                        <span onClick={() => {const a = prompt("Set Anchor:", anchor); if(a) setAnchor(a)}}>REF: {anchor} ✎</span>
                        <button onClick={() => {if(confirm("Reset?")) {setHistory([]); setAnchor("");}}} className="text-red-400 font-bold">RESET</button>
                    </div>

                    {/* Sequence Rows (Strictly limited height) */}
                    <div className="flex-1 overflow-hidden p-1.5 space-y-1">
                        {display.map((r, idx) => (
                            <div key={idx} className={`flex justify-between items-center px-3 py-2 rounded border text-[11px] ${
                                r.type === 'past' ? 'bg-slate-950/40 border-slate-800 opacity-40' : 
                                r.w === currentWin + 1 ? 'bg-blue-600/20 border-blue-500 ring-1 ring-blue-500/30' : 'bg-slate-800 border-transparent'
                            }`}>
                                <span className="font-mono text-slate-500">#{r.w}</span>
                                <span className={`font-black uppercase ${r.exp === 'GOLD' || r.exp === 'PREM' ? 'text-yellow-400' : 'text-slate-300'}`}>{r.exp}</span>
                                <span className="text-[10px] font-bold text-slate-400">{r.act || "-"}</span>
                            </div>
                        ))}
                    </div>

                    {/* Tight Control Panel */}
                    <div className="p-2 space-y-1 bg-slate-900 border-t border-slate-800">
                        <div className="grid grid-cols-3 gap-1">
                            <button onClick={() => addCrate('S')} className="bg-slate-800 py-3.5 rounded font-bold text-[11px] btn-active">S</button>
                            <button onClick={() => addCrate('F')} className="bg-slate-800 py-3.5 rounded font-bold text-[11px] btn-active">F (Full)</button>
                            <button onClick={() => addCrate('GP')} className="bg-green-900/40 border border-green-700 text-green-400 py-3.5 rounded font-bold text-[11px] btn-active">GP</button>
                        </div>
                        <button onClick={() => addCrate('G')} className="w-full bg-blue-700 py-3.5 rounded font-black text-xs uppercase btn-active shadow-lg">GOLD (G)</button>
                        <button onClick={() => addCrate('P/L')} className="w-full bg-yellow-500 text-black py-4 rounded font-black text-xs uppercase btn-active">PREMIUM HIT</button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
