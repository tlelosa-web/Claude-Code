<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Career Engine — Vacancy Pipeline</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0b0d12;
    --card: #161a22;
    --border: #262b36;
    --text: #e6e9ef;
    --muted: #8a92a3;
    --accent: #5b8cff;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --border: #e1e4ea;
      --text: #1a1d24;
      --muted: #6b7280;
      --accent: #3b5fe0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .subtitle .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #3ecf6b; margin-right: 6px; }
  .subtitle .dot.err { background: #e5484d; }
  .board {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
  }
  .col {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    min-height: 200px;
  }
  .col h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 0 0 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .col h2 .count {
    background: var(--accent);
    color: white;
    border-radius: 999px;
    padding: 1px 8px;
    font-size: 11px;
  }
  .card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 8px;
    font-size: 12.5px;
  }
  .card .title { font-weight: 600; margin-bottom: 2px; }
  .card .company { color: var(--muted); }
  .card .meta { display: flex; justify-content: space-between; margin-top: 6px; color: var(--muted); font-size: 11px; }
  .platform {
    text-transform: uppercase;
    font-size: 10px;
    letter-spacing: 0.04em;
  }
  .score { font-weight: 700; color: var(--accent); }
  .empty { color: var(--muted); font-size: 12px; font-style: italic; }
  .actions { display: flex; gap: 6px; margin-top: 8px; }
  .actions button {
    flex: 1;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    border-radius: 6px;
    padding: 5px 0;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }
  .actions button:disabled { opacity: 0.5; cursor: default; }
  .actions .approve { border-color: #3ecf6b; color: #3ecf6b; }
  .actions .approve:hover:not(:disabled) { background: #3ecf6b; color: #06120a; }
  .actions .reject { border-color: #e5484d; color: #e5484d; }
  .actions .reject:hover:not(:disabled) { background: #e5484d; color: #1a0505; }
  @media (max-width: 900px) {
    .board { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
  <h1>Career Engine — Vacancy Pipeline</h1>
  <div class="subtitle"><span class="dot" id="statusDot"></span><span id="statusText">connecting…</span></div>
  <div class="board" id="board"></div>

<script>
const STATUSES = [
  { key: "new", label: "New" },
  { key: "scored", label: "Scored" },
  { key: "asset_ready", label: "Asset Ready" },
  { key: "approved", label: "Approved" },
  { key: "rejected", label: "Rejected" },
];

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s ?? "";
  return d.innerHTML;
}

function render(data) {
  const board = document.getElementById("board");
  board.innerHTML = "";
  const byStatus = {};
  for (const s of STATUSES) byStatus[s.key] = [];
  for (const v of data.vacancies) {
    (byStatus[v.status] ??= []).push(v);
  }
  for (const s of STATUSES) {
    const col = document.createElement("div");
    col.className = "col";
    const count = data.counts[s.key] ?? 0;
    col.innerHTML = `<h2>${s.label}<span class="count">${count}</span></h2>`;
    const items = byStatus[s.key] ?? [];
    if (items.length === 0) {
      col.innerHTML += `<div class="empty">none</div>`;
    } else {
      for (const v of items) {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="title">${esc(v.title)}</div>
          <div class="company">${esc(v.company)}</div>
          <div class="meta">
            <span class="platform">${esc(v.platform)}</span>
            ${v.score != null ? `<span class="score">${v.score}</span>` : ""}
          </div>`;
        if (s.key === "asset_ready") {
          const actions = document.createElement("div");
          actions.className = "actions";
          actions.innerHTML = `
            <button class="approve" data-id="${v.id}" data-decision="approved">Approve</button>
            <button class="reject" data-id="${v.id}" data-decision="rejected">Reject</button>`;
          card.appendChild(actions);
        }
        col.appendChild(card);
      }
    }
    board.appendChild(col);
  }
}

async function poll() {
  const dot = document.getElementById("statusDot");
  const text = document.getElementById("statusText");
  try {
    const res = await fetch("/api/vacancies", { cache: "no-store" });
    if (!res.ok) throw new Error("server error " + res.status);
    const data = await res.json();
    render(data);
    dot.classList.remove("err");
    text.textContent = `live — ${data.vacancies.length} vacancies — updated ${new Date().toLocaleTimeString()}`;
  } catch (e) {
    dot.classList.add("err");
    text.textContent = "connection lost: " + e.message;
  }
}

async function submitDecision(id, decision, buttonEl) {
  const card = buttonEl.closest(".card");
  const buttons = card.querySelectorAll("button");
  buttons.forEach((b) => (b.disabled = true));
  try {
    const res = await fetch(`/api/vacancies/${id}/decision`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ decision }),
    });
    const data = await res.json();
    if (!res.ok || !data.ok) {
      throw new Error(data.error || `request failed (${res.status})`);
    }
    await poll();
  } catch (e) {
    alert(`Couldn't ${decision === "approved" ? "approve" : "reject"} vacancy ${id}: ${e.message}`);
    buttons.forEach((b) => (b.disabled = false));
  }
}

document.getElementById("board").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-decision]");
  if (!btn) return;
  submitDecision(btn.dataset.id, btn.dataset.decision, btn);
});

poll();
setInterval(poll, 4000);
</script>
</body>
</html>
