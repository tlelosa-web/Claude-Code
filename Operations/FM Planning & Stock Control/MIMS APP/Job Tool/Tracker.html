<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>💰 Pro Money Tracker (ZAR)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8f9fa;
      color: #212529;
      padding: 12px;
      font-size: 15px;
    }
    .container {
      max-width: 540px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      font-size: 20px;
      margin-bottom: 10px;
      color: #1a365d;
    }
    .balance-display {
      background: white;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .balance-label { font-size: 13px; color: #6c757d; display: block; }
    .balance-value {
      font-size: 20px;
      font-weight: 700;
      color: #2b6cb0;
      margin-top: 4px;
    }
    .input-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 5px;
      font-size: 14px;
      color: #2d3748;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      font-size: 16px;
      border: 1px solid #ced4da;
      border-radius: 8px;
      background: white;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      margin: 10px 0;
    }
    .btn {
      flex: 1;
      padding: 11px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-loss { background: #e53e3e; color: white; }
    .btn-win { background: #38a169; color: white; }
    .btn-secondary { background: #718096; color: white; font-size: 14px; padding: 9px; }
    .btn:active { opacity: 0.9; }
    .error {
      background: #fff5f5;
      color: #c53030;
      padding: 10px;
      border-radius: 6px;
      margin-top: 12px;
      display: none;
      font-size: 14px;
    }
    .results {
      margin-top: 12px;
      background: white;
      border-radius: 10px;
      padding: 14px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.08);
      display: none;
    }
    .row {
      display: flex;
      justify-content: space-between;
      margin: 6px 0;
      font-size: 14px;
    }
    .label { font-weight: 600; color: #4a5568; }
    .value { font-weight: 600; }
    .loss .value { color: #e53e3e; }
    .win .value { color: #38a169; }
    .section-title {
      font-size: 15px;
      font-weight: 700;
      margin: 10px 0 6px;
      color: #1a202c;
    }
    #history {
      margin-top: 16px;
      font-size: 13px;
      max-height: 180px;
      overflow-y: auto;
      padding: 10px;
      background: #f1f5f9;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }
    .history-item {
      padding: 5px 0;
      border-bottom: 1px solid #edf2f7;
      display: flex;
      justify-content: space-between;
    }
    .history-item:last-child { border: none; }
    .history-number { font-weight: bold; min-width: 24px; color: #4a5568; }
    .history-action { min-width: 20px; text-align: center; }
    .history-change { font-weight: 600; }
    .history-balance { color: #2b6cb0; font-weight: 600; }
    .history-time { color: #718096; font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>💰 Pro Money Tracker (ZAR)</h1>

    <div class="input-group">
      <label for="openingInput">Opening Balance (R)</label>
      <input type="number" id="openingInput" inputmode="decimal" placeholder="e.g., 1000" min="0.01" step="0.01" value="1000">
    </div>

    <button class="btn btn-secondary" onclick="setOpeningBalance()">✓ Set Opening Balance</button>

    <div class="balance-display">
      <span class="balance-label">Opening Balance</span>
      <div class="balance-value" id="opening-balance">R1 000.00</div>
    </div>
    <div class="balance-display">
      <span class="balance-label">Current Balance</span>
      <div class="balance-value" id="current-balance">R1 000.00</div>
    </div>

    <div class="input-group">
      <label for="riskPercent">Risk (%)</label>
      <input type="number" id="riskPercent" inputmode="decimal" placeholder="e.g., 5" min="0.01" max="100" step="0.1" value="5">
    </div>

    <div class="input-group">
      <label for="lowMultiplier">Low Multiplier</label>
      <input type="number" id="lowMultiplier" inputmode="decimal" placeholder="e.g., 2.5" min="0" step="0.1" value="2.5">
    </div>

    <div class="input-group">
      <label for="topMultiplier">Top Multiplier</label>
      <input type="number" id="topMultiplier" inputmode="decimal" placeholder="e.g., 3" min="0" step="0.1" value="3">
    </div>

    <div class="btn-group">
      <button class="btn btn-loss" onclick="recordTrade('loss')">🟥 Record Loss</button>
      <button class="btn btn-win" onclick="recordTrade('win')">🟩 Record Win</button>
    </div>

    <div class="btn-group">
      <button class="btn btn-secondary" onclick="resetBalance()">↺ Reset to Opening</button>
      <button class="btn btn-secondary" onclick="exportLog()">📤 Export Log</button>
    </div>

    <div id="error" class="error"></div>

    <div id="results" class="results">
      <div class="row"><span class="label">Risk Amount:</span> <span class="value" id="out-risk-amount"></span></div>
      <div class="row"><span class="label">Top Value:</span> <span class="value" id="out-top"></span></div>
      <div class="row"><span class="label">Low Value:</span> <span class="value" id="out-low"></span></div>

      <div id="loss-section" style="display:none;">
        <div class="section-title">🟥 Loss Recorded</div>
        <div class="row loss"><span class="label">New Balance:</span> <span class="value" id="out-loss-balance"></span></div>
      </div>

      <div id="win-section" style="display:none;">
        <div class="section-title">🟩 Win Recorded</div>
        <div class="row win"><span class="label">Profit (Low × <span id="disp-low-mult">2.5</span>):</span> <span class="value" id="out-profit-low"></span></div>
        <div class="row win"><span class="label">Profit (Top × <span id="disp-top-mult">3</span>):</span> <span class="value" id="out-profit-top"></span></div>
        <div class="row win"><span class="label">Total Profit:</span> <span class="value" id="out-total-profit"></span></div>
        <div class="row win"><span class="label">New Balance:</span> <span class="value" id="out-win-balance"></span></div>
      </div>
    </div>

    <h3 style="margin:16px 0 8px;font-size:16px;color:#1a202c;">📜 Trade History</h3>
    <div id="history">
      <div class="history-item">
        <span class="history-number">#1</span>
        <span class="history-action">BeginInit</span>
        <span class="history-change">+R0.00</span>
        <span class="history-balance">R1 000.00</span>
        <span class="history-time">—</span>
      </div>
    </div>
  </div>

  <script>
    // State
    let openingBalance = 1000;
    let currentBalance = openingBalance;
    let tradeLog = [
      { id: 1, type: 'init', change: 0, balance: openingBalance, time: new Date() }
    ];
    let nextId = 2;

    function formatZAR(num) {
      const sign = num < 0 ? '-' : '';
      const abs = Math.abs(num);
      return sign + 'R' + abs.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    }

    function formatTime(date) {
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function showError(msg) {
      const el = document.getElementById('error');
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 4000);
    }

    function updateBalanceDisplay() {
      document.getElementById('opening-balance').textContent = formatZAR(openingBalance);
      document.getElementById('current-balance').textContent = formatZAR(currentBalance);
    }

    function addToLog(type, change, balance) {
      const entry = {
        id: nextId++,
        type: type,
        change: change,
        balance: balance,
        time: new Date()
      };
      tradeLog.push(entry);
      renderHistory();
    }

    function renderHistory() {
      const container = document.getElementById('history');
      container.innerHTML = tradeLog.map((item, i) => {
        let action = 'BeginInit';
        let changeStr = `+${formatZAR(0)}`;
        let changeColor = '#4a5568';

        if (item.type === 'loss') {
          action = '🟥 Loss';
          changeStr = `−${formatZAR(Math.abs(item.change))}`;
          changeColor = '#e53e3e';
        } else if (item.type === 'win') {
          action = '🟩 Win';
          changeStr = `+${formatZAR(item.change)}`;
          changeColor = '#38a169';
        }

        return `
          <div class="history-item">
            <span class="history-number">#${item.id}</span>
            <span class="history-action">${action}</span>
            <span class="history-change" style="color:${changeColor}">${changeStr}</span>
            <span class="history-balance">${formatZAR(item.balance)}</span>
            <span class="history-time">${formatTime(item.time)}</span>
          </div>
        `;
      }).join('');

      // Auto-scroll to bottom
      container.scrollTop = container.scrollHeight;
    }

    function setOpeningBalance() {
      const val = parseFloat(document.getElementById('openingInput').value);
      if (isNaN(val) || val <= 0) {
        showError('Please enter a valid opening balance > R0.');
        return;
      }
      openingBalance = val;
      currentBalance = openingBalance;
      tradeLog = [
        { id: 1, type: 'init', change: 0, balance: openingBalance, time: new Date() }
      ];
      nextId = 2;
      updateBalanceDisplay();
      renderHistory();
      document.getElementById('results').style.display = 'none';
      document.getElementById('openingInput').blur(); // hide keyboard
    }

    function recordTrade(mode) {
      const riskPercent = parseFloat(document.getElementById('riskPercent').value);
      const lowMult = parseFloat(document.getElementById('lowMultiplier').value);
      const topMult = parseFloat(document.getElementById('topMultiplier').value);

      if (isNaN(riskPercent) || riskPercent <= 0 || riskPercent > 100) {
        showError('Risk % must be 0.01–100.');
        return;
      }
      if (isNaN(lowMult) || lowMult < 0 || isNaN(topMult) || topMult < 0) {
        showError('Multipliers ≥ 0.');
        return;
      }

      document.getElementById('disp-low-mult').textContent = lowMult;
      document.getElementById('disp-top-mult').textContent = topMult;

      const riskAmount = currentBalance * (riskPercent / 100);
      const topValue = riskAmount / 1.95;
      const lowValue = 0.95 * topValue;

      document.getElementById('out-risk-amount').textContent = formatZAR(riskAmount);
      document.getElementById('out-top').textContent = formatZAR(topValue);
      document.getElementById('out-low').textContent = formatZAR(lowValue);

      document.getElementById('results').style.display = 'block';
      document.getElementById('loss-section').style.display = 'none';
      document.getElementById('win-section').style.display = 'none';

      let change = 0;

      if (mode === 'loss') {
        change = -riskAmount;
        currentBalance += change; // i.e., subtract
        document.getElementById('out-loss-balance').textContent = formatZAR(currentBalance);
        document.getElementById('loss-section').style.display = 'block';
      } else if (mode === 'win') {
        const profitLow = lowValue * lowMult;
        const profitTop = topValue * topMult;
        change = profitLow + profitTop;
        currentBalance += change;
        document.getElementById('out-profit-low').textContent = formatZAR(profitLow);
        document.getElementById('out-profit-top').textContent = formatZAR(profitTop);
        document.getElementById('out-total-profit').textContent = formatZAR(change);
        document.getElementById('out-win-balance').textContent = formatZAR(currentBalance);
        document.getElementById('win-section').style.display = 'block';
      }

      addToLog(mode, change, currentBalance);
      updateBalanceDisplay();
    }

    function resetBalance() {
      if (confirm(`Reset to opening balance (${formatZAR(openingBalance)})?`)) {
        currentBalance = openingBalance;
        // Add reset as a "loss" if balance dropped, or "win" if grew — but simpler: just log as reset
        const change = openingBalance - tradeLog[tradeLog.length - 1].balance;
        addToLog(change === 0 ? 'init' : (change > 0 ? 'win' : 'loss'), change, openingBalance);
        updateBalanceDisplay();
        document.getElementById('results').style.display = 'none';
      }
    }

    function exportLog() {
      if (tradeLog.length <= 1) {
        alert('No trades recorded yet.');
        return;
      }

      let text = `💰 Money Tracker Log (ZAR)\n`;
      text += `Opening Balance: ${formatZAR(openingBalance)}\n`;
      text += `Current Balance: ${formatZAR(currentBalance)}\n`;
      text += `\nTrade History:\n`;
      text += `# | Type     | Change     | Balance     | Time\n`;
      text += `- | -------- | ---------- | ----------- | -------\n`;

      tradeLog.forEach(item => {
        if (item.type === 'init') return;
        const type = item.type === 'win' ? 'Win' : 'Loss';
        const changeStr = (item.change >= 0 ? '+' : '') + formatZAR(item.change);
        const timeStr = item.time.toLocaleString([], { 
          day: '2-digit', 
          month: 'short', 
          hour: '2-digit', 
          minute: '2-digit' 
        });
        text += `${item.id} | ${type.padEnd(8)} | ${changeStr.padEnd(10)} | ${formatZAR(item.balance).padEnd(11)} | ${timeStr}\n`;
      });

      text += `\nExported: ${new Date().toLocaleString()}`;

      // Try to use Web Share API (modern Android)
      if (navigator.share) {
        navigator.share({
          title: 'Money Tracker Log',
          text: text,
          filename: 'money-tracker-log.txt'
        }).catch(err => {
          if (err.name !== 'AbortError') copyToClipboard(text);
        });
      } else {
        copyToClipboard(text);
      }
    }

    function copyToClipboard(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
      alert('✅ Log copied to clipboard!\nPaste into Notes, WhatsApp, or Email.');
    }

    // Initialise
    window.addEventListener('load', () => {
      // Set initial input value
      document.getElementById('openingInput').value = openingBalance;
      updateBalanceDisplay();
      renderHistory();
    });
  </script>
</body>
</html>
