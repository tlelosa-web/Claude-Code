<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Clash Tracker - Compact</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const STEPS = {
            1: { p: 12, g: [4, 8] },
            2: { p: 24, g: [5, 10, 15, 20] },
            3: { p: 26, g: [9, 13, 17, 21] },
            4: { p: 40, g: [8, 16, 24, 32] },
            5: { p: 32, g: [6, 12, 18, 24] },
            6: { p: 48, g: [8, 16, 24, 32, 40] },
            7: { p: 24, g: [5, 10, 15, 20] },
            8: { p: 24, g: [4, 8, 12, 16, 20] }
        };

        const App = () => {
            const [anchor, setAnchor] = useState(() => localStorage.getItem('f1_8_anchor') || "4436");
            const [activeStep, setActiveStep] = useState(() => parseInt(localStorage.getItem('f1_8_step')) || 3);
            const [history, setHistory] = useState(() => JSON.parse(localStorage.getItem('f1_8_history')) || []);
            const [gpCount, setGpCount] = useState(() => parseInt(localStorage.getItem('f1_8_gp')) || 0);

            useEffect(() => {
                localStorage.setItem('f1_8_anchor', anchor);
                localStorage.setItem('f1_8_step', activeStep);
                localStorage.setItem('f1_8_history', JSON.stringify(history));
                localStorage.setItem('f1_8_gp', gpCount);
            }, [anchor, activeStep, history, gpCount]);

            const currentWin = parseInt(anchor) + history.length;
            
            const addCrate = (type) => {
                if (type === 'GP') setGpCount(prev => prev + 1);
                setHistory([...history, type]);
            };

            const getExpected = (winNum) => {
                const distance = (winNum - parseInt(anchor)) - gpCount;
                const pattern = STEPS[activeStep];
                if (distance === pattern.p) return 'PREMIUM';
                if (pattern.g.includes(distance)) return 'GOLD';
                return 'S / F';
            };

            const reset = () => { if(confirm("Reset?")) { setHistory([]); setGpCount(0); setAnchor(""); } };

            // Condensed List: Last 1 (Past) and Next 7 (Future) = 8 Total
            const display = [];
            for (let i = history.length - 1; i >= Math.max(0, history.length - 1); i--) {
                const w = parseInt(anchor) + i + 1;
                display.push({ win: w, actual: history[i], expected: getExpected(w), type: 'past' });
            }
            for (let i = history.length; i < history.length + 7; i++) {
                const w = parseInt(anchor) + i + 1;
                display.push({ win: w, actual: null, expected: getExpected(w), type: 'future' });
            }

            return (
                <div className="h-full flex flex-col items-center justify-start p-2 max-w-md mx-auto">
                    <div className="w-full bg-slate-900 rounded-2xl border border-slate-800 shadow-xl flex flex-col max-h-[98vh]">
                        
                        {/* Compact Header */}
                        <div className="bg-red-700 p-2 flex justify-between items-center rounded-t-2xl">
                            <h1 className="text-sm font-black italic uppercase">Crate Tracker</h1>
                            <select value={activeStep} onChange={(e) => setActiveStep(parseInt(e.target.value))} className="bg-black/30 text-[10px] p-1 rounded font-bold outline-none">
                                {[1,2,3,4,5,6,7,8].map(s => <option key={s} value={s}>Step {s}</option>)}
                            </select>
                        </div>

                        {/* Status Bar */}
                        <div className="flex justify-between px-3 py-1 bg-slate-800 text-[10px] font-bold border-b border-slate-700">
                            <span>Win: {currentWin}</span>
                            <span onClick={() => {const a = prompt("Anchor:", anchor); if(a) setAnchor(a)}}>Ref: {anchor} ✎</span>
                        </div>

                        {/* Condensed Log Area */}
                        <div className="flex-1 overflow-hidden p-2 space-y-1">
                            {display.map((race, idx) => (
                                <div key={idx} className={`flex justify-between items-center px-3 py-1.5 rounded-lg border text-[11px] ${
                                    race.type === 'past' ? 'bg-slate-950/50 border-slate-800 opacity-40' : 
                                    race.win === currentWin + 1 ? 'bg-blue-600/10 border-blue-500 ring-1 ring-blue-500/20' : 'bg-slate-800 border-transparent'
                                }`}>
                                    <span className="font-mono text-slate-500">#{race.win}</span>
                                    <span className={`font-black ${race.expected !== 'S / F' ? 'text-yellow-400' : 'text-slate-200'}`}>{race.expected}</span>
                                    <span className="text-[9px] uppercase font-bold text-slate-500">{race.actual ? race.actual : "..."}</span>
                                </div>
                            ))}
                        </div>

                        {/* Compressed Action Buttons */}
                        <div className="p-2 space-y-1 border-t border-slate-800 bg-slate-900/50 rounded-b-2xl">
                            <div className="grid grid-cols-3 gap-1">
                                <button onClick={() => addCrate('S')} className="bg-slate-800 py-3 rounded font-bold text-xs">S</button>
                                <button onClick={() => addCrate('F')} className="bg-slate-800 py-3 rounded font-bold text-xs">F (Full)</button>
                                <button onClick={() => addCrate('GP')} className="bg-green-900/30 border border-green-700 text-green-400 py-3 rounded font-bold text-xs">GP</button>
                            </div>
                            <button onClick={() => addCrate('G')} className="w-full bg-blue-600 py-3 rounded font-black text-xs uppercase shadow-lg shadow-blue-500/10">Got Gold (G)</button>
                            <button onClick={() => addCrate('P/L')} className="w-full bg-yellow-500 text-black py-3 rounded font-black text-xs uppercase">Premium Hit</button>
                            <button onClick={reset} className="w-full text-[8px] text-slate-600 uppercase font-bold py-1">Reset</button>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
